[project]
name = "hermes-mail-integrations"
version = "0.1.0"
description = "Phase 3 local integration setup and probes; not the business harness"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "langsmith>=0.4,<1", "langchain-core>=1,<2",
  "sqlalchemy>=2,<3", "alembic>=1.14,<2",
  "google-api-python-client>=2.160,<3", "google-auth-oauthlib>=1.2,<2",
  "keyring>=25,<26", "httpx>=0.28,<1",
  "langchain-openai>=1,<2", "openai>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
mail-tools = "mail_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
